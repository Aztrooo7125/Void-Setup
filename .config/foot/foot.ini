# Foot — Void Night theme, semi-transparent

[main]
font = JetBrainsMono Nerd Font:size=9
dpi-aware = no

[csd]
preferred = server
size = 0

[scrollback]
lines = 10000

[cursor]
style = block
blink = yes

[colors-dark]
alpha = 0.75
background = 1a1e24
foreground = c5cdd8

# Void Night — Nord-derived, pulled darker, less blue-saturated
regular0 = 2a2f38   # black
regular1 = bf616a   # red
regular2 = 8faa7a   # green  (slightly warmer than Nord)
regular3 = d4b87a   # yellow (slightly warmer)
regular4 = 6e9dbf   # blue   (our muted accent)
regular5 = a88cbd   # magenta (slightly subdued)
regular6 = 7ab8c0   # cyan
regular7 = c5cdd8   # white

bright0 = 3a404c
bright1 = c47070
bright2 = 9ab888
bright3 = e0c888
bright4 = 82adc8
bright5 = b49ac8
bright6 = 88c5cc
bright7 = dce4f0

[mouse]
hide-when-typing = yes
